[project]
name = "punto81"
version = "1.0.0"
description = "Reconstrucción 2026 de POKER (Steve North, 1978) como TUI Textual."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "David Vivo", email = "david@example.invalid" },
]
keywords = ["poker", "tui", "textual", "retro", "game"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "textual>=0.85",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "structlog>=24.1",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
audio = ["numpy>=1.26"]

[project.scripts]
punto81 = "punto81.__main__:app"

[project.urls]
Homepage = "https://github.com/davidvivo-ia/pokerpython"
Source = "https://github.com/davidvivo-ia/pokerpython"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "textual-dev>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/punto81"]

[tool.hatch.build.targets.wheel.force-include]
"src/punto81/assets" = "punto81/assets"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
    "PT",   # pytest
    "PL",   # pylint
    "TID",  # tidy imports
    "ANN",  # annotations
    "D",    # docstrings
]
ignore = [
    "D203",     # one-blank-line-before-class (incompatible with D211)
    "D213",     # multi-line-summary-second-line (incompatible with D212)
    "PLR0911",  # too-many-return-statements (poker evaluator has 9, intentional)
    "PLR0913",  # too-many-arguments (we use kw-only ctors)
    "PLR2004",  # magic-value-comparison
    "D105",     # missing docstring in dunder
    "D104",     # missing docstring in public package
    "D100",     # missing docstring in public module — covered case-by-case
    "RUF001",   # ambiguous unicode (we use · intentionally in UI strings)
    "RUF002",   # ambiguous unicode in docstrings (we use × intentionally)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "PLR2004", "S101"]
"src/punto81/__main__.py" = ["D"]
# Textual framework overrides do not need their own docstrings:
"src/punto81/presentation/**/*.py" = ["D102", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/punto81"]
omit = [
    # Textual TUI is exercised by a headless smoke test only; deep
    # coverage is tracked as v1.1 work in TODO.md.
    "src/punto81/presentation/tui_app.py",
    "src/punto81/presentation/widgets/*.py",
    "src/punto81/infrastructure/clock/*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 80
